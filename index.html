
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS Personal AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  background:radial-gradient(circle,#123b58,#020711 75%);
  color:#e5faff;font-family:Arial,sans-serif;
  display:flex;justify-content:center;align-items:center
}
.app{width:100%;max-width:650px}
h1{text-align:center;color:#36dfff;letter-spacing:5px}
.orb{
  width:110px;height:110px;border-radius:50%;
  margin:20px auto;background:#08bce9;
  box-shadow:0 0 25px #08bce9,0 0 65px #087da8;
  animation:pulse 2s infinite
}
@keyframes pulse{50%{box-shadow:0 0 45px #08bce9,0 0 90px #087da8}}
.panel{
  background:#071b2c;border:1px solid #087da8;
  border-radius:14px;padding:16px;margin:12px 0
}
button,input,textarea{
  width:100%;padding:12px;margin:6px 0;
  border-radius:8px;border:1px solid #159ac1;
  background:#102c42;color:white;font-size:15px
}
button{cursor:pointer;background:#087da8}
button:hover{background:#0b9bc8}
textarea{min-height:100px;resize:vertical}
#messages{min-height:100px;white-space:pre-wrap;overflow-wrap:anywhere}
.small{color:#9bd9ed;font-size:13px}
</style>
</head>
<body>
<div class="app">
<h1>J.A.R.V.I.S</h1>
<div class="orb"></div>
<p style="text-align:center;color:#36dfff">PERSONAL VOICE ASSISTANT</p>

<div class="panel">
  <div id="status">System ready. Select a file or give a command.</div>
  <div id="messages">JARVIS: Hello! How can I help you?</div>
</div>

<div class="panel">
  <input id="command" placeholder="Type a command or use the microphone">
  <button onclick="sendCommand()">SEND COMMAND</button>
  <button onclick="startVoice()">🎤 SPEAK TO JARVIS</button>
  <button onclick="speakReply()">🔊 READ LAST REPLY</button>
</div>

<div class="panel">
  <b>MY FILES</b>
  <p class="small">Choose a text file to let JARVIS read it.</p>
  <input type="file" id="filePicker" accept=".txt,.md,.csv,.json">
  <button onclick="readFile()">READ SELECTED FILE</button>
  <textarea id="fileText" placeholder="Selected file content appears here..." readonly></textarea>
</div>

<div class="panel">
  <b>CLIPBOARD</b>
  <button onclick="copyReply()">COPY LAST REPLY</button>
  <button onclick="pasteClipboard()">PASTE FROM CLIPBOARD</button>
  <p class="small">You can paste copied text into another application using Ctrl + V.</p>
</div>

<script>
let lastReply = "Hello! How can I help you?";

function showReply(text) {
  lastReply = text;
  document.getElementById("messages").textContent =
    "JARVIS: " + text;
  document.getElementById("status").textContent = "Ready";
}

function sendCommand() {
  const box = document.getElementById("command");
  const command = box.value.trim();
  if (!command) return;

  document.getElementById("messages").textContent =
    "YOU: " + command;
  box.value = "";

  const c = command.toLowerCase();
  let answer = "I don't know that command yet. Try saying help.";

  if (c.includes("hello") || c.includes("hi jarvis")) {
    answer = "Hello! I am JARVIS, your personal assistant.";
  }
  else if (c.includes("your name")) {
    answer = "My name is JARVIS. I am your personal browser assistant.";
  }
  else if (c.includes("time")) {
    answer = "The time is " +
      new Date().toLocaleTimeString("en-IN");
  }
  else if (c.includes("date") || c.includes("today")) {
    answer = "Today's date is " +
      new Date().toLocaleDateString("en-IN");
  }
  else if (c.includes("read file")) {
    answer = "Please select a file and press Read Selected File.";
  }
  else if (c.includes("help")) {
    answer = "You can ask for the time, date, calculations, or say read file. You can also select a text file, copy my reply, and paste clipboard text.";
  }
  else if (c.startsWith("copy ")) {
    answer = command.substring(5);
  }
  else if (/^[0-9+\-*/().\s]+$/.test(command)) {
    try {
      const result = Function(
        '"use strict"; return (' + command + ')'
      )();
      answer = Number.isFinite(result)
        ? "The answer is " + result
        : "That calculation is not valid.";
    } catch {
      answer = "I could not calculate that.";
    }
  }

  showReply(answer);
}

function readFile() {
  const picker = document.getElementById("filePicker");
  const file = picker.files[0];

  if (!file) {
    showReply("Please select a file first.");
    return;
  }

  const reader = new FileReader();
  reader.onload = function() {
    document.getElementById("fileText").value = reader.result;
    showReply("I have opened " + file.name +
      ". You can now read its text below.");
  };
  reader.onerror = function() {
    showReply("I could not read that file.");
  };
  reader.readAsText(file);
}

function copyReply() {
  navigator.clipboard.writeText(lastReply)
    .then(() => showReply("Last reply copied to clipboard."))
    .catch(() => showReply("Clipboard access was blocked. Check browser permissions."));
}

async function pasteClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById("command").value = text;
    showReply("Clipboard text pasted into the command box.");
  } catch {
    showReply("Clipboard permission was blocked by your browser.");
  }
}

function speakReply() {
  if (!("speechSynthesis" in window)) {
    showReply("Speech output is not supported in this browser.");
    return;
  }
  speechSynthesis.cancel();
  const speech = new SpeechSynthesisUtterance(lastReply);
  speech.lang = "en-IN";
  speechSynthesis.speak(speech);
}

function startVoice() {
  const Recognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!Recognition) {
    showReply("Voice recognition is not supported. Try Chrome.");
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "en-IN";
  recognition.interimResults = false;
  recognition.onstart = () => {
    document.getElementById("status").textContent = "Listening...";
  };
  recognition.onresult = event => {
    document.getElementById("command").value =
      event.results[0][0].transcript;
    sendCommand();
  };
  recognition.onerror = () => {
    showReply("I could not hear you. Please try again.");
  };
  recognition.onend = () => {
    document.getElementById("status").textContent = "Ready";
  };
  recognition.start();
}

document.getElementById("command").addEventListener("keydown", e => {
  if (e.key === "Enter") sendCommand();
});
</script>
</div>
</body>
</html>
